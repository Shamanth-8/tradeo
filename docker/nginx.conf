server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HashRouter means every route resolves to index.html anyway, but this
    # keeps direct hits on any path working too.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API so the browser sees one origin and CORS never applies.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Server-sent events for streamed answers: buffering here would hold
        # tokens back until the response completed, defeating the point.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
